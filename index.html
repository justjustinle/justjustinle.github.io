<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #ffdde1 0%, #ee9ca7 35%, #ff758c 70%, #ff7eb3 100%);
      color: #2b0b16;
      overflow: hidden;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(255,255,255,0.35), rgba(255,255,255,0.05));
      pointer-events: none;
    }

    .container {
      position: relative;
      max-width: 480px;
      width: 92%;
      padding: 32px 26px 28px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow:
        0 22px 60px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.6);
      text-align: center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .heart {
      position: relative;
      margin: 0 auto 16px;
      width: 90px;
      height: 80px;
      transform: rotate(-45deg);
      background: linear-gradient(135deg, #ff3b6c, #ff6b9c);
      box-shadow: 0 12px 25px rgba(255, 59, 108, 0.45);
      animation: beat 1s infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: inherit;
    }

    .heart::before {
      top: -45px;
      left: 0;
    }

    .heart::after {
      left: 45px;
      top: 0;
    }

    @keyframes beat {
      0%, 100% { transform: rotate(-45deg) scale(1); }
      20% { transform: rotate(-45deg) scale(1.08); }
      40% { transform: rotate(-45deg) scale(0.98); }
      60% { transform: rotate(-45deg) scale(1.12); }
      80% { transform: rotate(-45deg) scale(1.02); }
    }

    .tagline {
      font-family: "Sacramento", cursive;
      font-size: 1.9rem;
      color: #c21e4f;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 1.3rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a1433;
      margin-bottom: 10px;
    }

    .message {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #4a1a2d;
      margin-bottom: 22px;
    }

    .message span.name {
      font-weight: 700;
      color: #c21e4f;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 8px;
      position: relative;
    }

    button {
      border: none;
      padding: 11px 26px;
      border-radius: 999px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.2s ease, color 0.2s ease;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff477e, #ff2e63);
      color: #fff;
      box-shadow: 0 10px 22px rgba(255, 72, 125, 0.45);
    }

    .btn-yes:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 26px rgba(255, 72, 125, 0.6);
    }

    .btn-no {
      background: #ffe4ec;
      color: #8a1433;
      min-width: 90px;
    }

    .btn-no:hover {
      transform: translateY(-2px);
      background: #ffd1e1;
    }

    .footer-text {
      margin-top: 10px;
      font-size: 0.82rem;
      color: #7a2240;
      opacity: 0.8;
    }

    .answer-text {
      margin-top: 14px;
      font-size: 1.02rem;
      font-weight: 600;
      color: #c21e4f;
      min-height: 1.2em;
    }

    /* Floating hearts in background */
    .floating-heart {
      position: fixed;
      font-size: 18px;
      opacity: 0.8;
      animation: floatUp 9s linear infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% { opacity: 0.7; }
      to {
        transform: translateY(-10vh) translateX(-20px);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 26px 20px 22px;
        border-radius: 20px;
      }

      .heart {
        width: 76px;
        height: 68px;
      }

      .heart::before,
      .heart::after {
        width: 76px;
        height: 76px;
      }

      .tagline {
        font-size: 1.7rem;
      }

      h1 {
        font-size: 1.15rem;
      }

      .buttons {
        flex-direction: row;
        gap: 10px;
      }

      button {
        padding: 10px 20px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="container">
    <div class="heart"></div>

    <div class="tagline">Hey, babe</div>
    <h1>Will you be my Valentine?</h1>

    <p class="message">
      I could send a text or buy a card, but I wanted to make something a little more <strong>us</strong>.<br>
      So here it is, one simple question for you,
      <span class="name">my love</span>… 💌
    </p>

    <div class="buttons">
      <button class="btn-yes" id="yesBtn">Yes 💖</button>
      <button class="btn-no" id="noBtn">No 🙈</button>
    </div>

    <div class="answer-text" id="answerText"></div>

    <p class="footer-text">
      Made with way too much smiling at my screen while thinking about you.
    </p>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const answerText = document.getElementById("answerText");

    yesBtn.addEventListener("click", () => {
      answerText.textContent = "Yay! See you on the 14th my love 💕";
    });

    noBtn.addEventListener("mouseover", () => {
      const rect = noBtn.getBoundingClientRect();
      const offsetX = (Math.random() - 0.5) * 180;
      const offsetY = (Math.random() - 0.5) * 120;
      noBtn.style.position = "relative";
      noBtn.style.left = offsetX + "px";
      noBtn.style.top = offsetY + "px";
    });

    noBtn.addEventListener("click", () => {
      answerText.textContent = "Hmm, I think you meant to press the other button 😉";
    });

    // Floating hearts
    const emojis = ["❤️", "💕", "💖", "💘", "💗"];
    function spawnHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 7 + Math.random() * 4 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 11000);
    }

    for (let i = 0; i < 18; i++) {
      setTimeout(spawnHeart, i * 500);
    }
    setInterval(spawnHeart, 1600);
  </script>
</body>
</html>
